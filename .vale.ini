StylesPath = styles
MinAlertLevel = suggestion

Vocab = RAGService # styles/config/vocabularies/RAGService

Packages = Microsoft

IgnoredScopes = \
  text.frontmatter.id, \
  text.frontmatter.content_type, \
  text.frontmatter.lifecycle_status, \
  text.frontmatter.topics, \
  text.frontmatter.components, \
  text.frontmatter.prerequisites, \
  text.frontmatter.next_steps, \
  text.frontmatter.related_pages, \
  text.frontmatter.related_terms, \
  text.frontmatter.last_modified, \
  text.frontmatter.dataset_version, \
  text.frontmatter.evaluation_version, \
  text.frontmatter.version, \
  text.frontmatter.release_date, \
  text.frontmatter.tags, \
  text.frontmatter.max-toc-depth

[*.{md,mdx}]
BasedOnStyles = Microsoft, RAGService # styles/RAGService

Microsoft.We = NO
Microsoft.Acronyms = NO
Microsoft.Vocab = NO
Microsoft.Militaristic = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Accessibility = NO
Microsoft.GeneralURL = NO
Microsoft.Uppercase = NO
Microsoft.Quotes = NO