instances:
  - url: https://python-rag-service.docs.buildwithfern.com
title: Python RAG Service | Documentation

default-language: curl

metadata:
  og:site_name: "Python RAG Service Documentation"
  og:title: "Python RAG Service Documentation"
  og:description: "to come"
  og:url: "https://python-rag-service.docs.buildwithfern.com/"
  og:locale: "en_US"

theme:
  page-actions: toolbar

layout:
  tabs-placement: header
  hide-nav-links: true
  changelog-layout: classic
css: styles.css
colors:
  accentPrimary: '#ffffff'
  background: '#02235b'

check:
  rules:
    broken-links: error
    # request/response examples in the OpenAPI spec must match their schemas. This defaults to warn
    example-validation: error
    # OpenAPI $ref values shouldn’t point to unsupported locations outside #/components
    no-non-component-refs: error
    # local OpenAPI $refs must actually point to something that exists. This also defaults to warn.
    valid-local-references: error
    valid-docs-endpoints: error

tabs:
  docs:
    display-name: Docs
    icon: book-open
    slug: docs
  api:
    display-name: API reference
    icon: puzzle
    slug: reference
  changelog:
    display-name: Release notes
    changelog: docs/pages/changelog
    icon: light clock

navigation:
  - tab: docs
    layout:
      - page: Home
        path: docs/pages/home.mdx
      - section: Get started
        contents:
          - page: Quickstart
            path: docs/pages/get-started/quickstart.mdx
          - page: Install
            path: docs/pages/get-started/install.mdx
          - page: Configure the service
            path: docs/pages/get-started/configure-service.mdx
          - page: Authentication
            path: docs/pages/get-started/authentication.mdx
      - section: Index content
        contents:
          - page: Index WordPress content
            path: docs/pages/index-content/index-wordpress.mdx
            slug: index-wordpress-content
          - page: Re-index and update content
            path: docs/pages/index-content/re-index-and-update.mdx
          - page: Build your first documentation index
            path: docs/pages/index-content/build-inspect-your-first-documentation-index.mdx
      - section: Search and answer
        contents:
          - page: Overview
            path: docs/pages/search-answer/overview.mdx
          - page: Search documentation
            path: docs/pages/search-answer/search-documentation.mdx
          - page: Generate grounded answers
            path: docs/pages/search-answer/generate-grounded-answers.mdx
          - page: Build a search experience with the RAG API
            path: docs/pages/search-answer/build-search-experience-with-rag-api.mdx
            slug: build-search-experience-with-rag-api
      - section: Integrate
        contents:
          - page: Integrate the RAG API into an application
            path: docs/pages/integrate/integrate-rag-api-into-application.mdx
            slug: integrate-rag-api-into-application
          - page: Integrate with WordPress
            path: docs/pages/integrate/integrate-with-wordpress.mdx
            slug: integrate-with-wordpress
      - section: Evaluate
        contents:
          - page: How evaluation works
            path: docs/pages/evaluate/how-evaluation-works.mdx
          - page: Run the evaluation
            path: docs/pages/evaluate/run-the-evaluation.mdx
          - page: Retrieval evaluation
            path: docs/pages/evaluate/retrieval-evaluation.mdx
          - page: Answer evaluation
            path: docs/pages/evaluate/answer-evaluation.mdx
          - page: Recorded evaluation results
            path: docs/pages/evaluate/recorded-evaluation-results.mdx
      - section: Architecture
        contents:
          - page: System architecture
            path: docs/pages/architecture/system-architecture.mdx
          - page: Indexing pipeline
            path: docs/pages/architecture/indexing-pipeline.mdx
          - page: Retrieval pipeline
            path: docs/pages/architecture/retrieval-pipeline.mdx
          - page: Answer generation and citations
            path: docs/pages/architecture/answer-generation-and-citations.mdx
          - page: Evaluation architecture
            path: docs/pages/architecture/evaluation-architecture.mdx
      - section: Reference
        contents:
          - page: Known limitations
            path: docs/pages/reference/known-limitations.mdx
          - page: Configuration reference
            path: docs/pages/reference/configuration-reference.mdx
          - page: Evaluation framework reference
            path: docs/pages/reference/evaluation-framework-reference.mdx
          - page: Glossary
            path: docs/pages/reference/glossary.mdx
  - tab: api
    layout:
      - section: API reference
        skip-slug: true
        contents:
          - page: Overview
            path: docs/pages/api/overview.mdx
          - page: Errors
            path: docs/pages/api/errors.mdx
      - api: Search and answer
        paginated: true
        skip-slug: true
        layout:
          - endpoint: POST /v1/search
            slug: search
            title: Search indexed docs
          - endpoint: POST /v1/answer
            slug: answer
            title: Generate grounded answer
          - endpoint: GET /health
            slug: health
            title: Health check
  - tab: changelog