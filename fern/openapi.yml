  /v1/answer:
    post:
      tags:
      - Answer
      summary: Generate a grounded answer
      description: Search indexed documentation and generate an answer based on the
        retrieved content. The response includes citations to the sources used. Optional
        `filters` narrow the documents searched.
      operationId: answer_v1_answer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
            examples:
              grounded_answer:
                summary: Grounded answer
                value:
                  query: Why does inconsistent terminology cause retrieval failures?
                  filters:
                    source: wordpress
              insufficient_evidence:
                summary: Insufficient evidence
                value:
                  query: What is the capital of Mars?
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
              examples:
                grounded_answer:
                  summary: Grounded answer
                  value:
                    query: Why does inconsistent terminology cause retrieval failures?
                    answer: Inconsistent terminology can cause retrieval failures
                      because the query and documentation may use different language
                      for the same concept. [S1]
                    sources:
                    - citation_id: S1
                      chunk_id: wordpress:page:1:chunk:0
                      document_id: wordpress:page:1
                      title: Retrieval Failures
                      heading_path:
                      - Vocabulary mismatch
                      anchor: vocabulary-mismatch
                      excerpt: Inconsistent terminology can make relevant content
                        harder to retrieve.
                      url: https://example.test/retrieval-failures
                    sufficient_evidence: true
                insufficient_evidence:
                  summary: Insufficient evidence
                  value:
                    query: What is the capital of Mars?
                    answer: The available documentation does not provide enough information
                      to answer this question.
                    sources: []
                    sufficient_evidence: false
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authentication_failed:
                  summary: Authentication failed
                  value:
                    error:
                      code: authentication_failed
                      message: A valid API key is required.
                      details: []
        '413':
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_too_large:
                  summary: Request too large
                  value:
                    error:
                      code: request_too_large
                      message: The request body is too large.
                      details: []
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    error:
                      code: validation_error
                      message: Request validation failed.
                      details:
                      - field: limit
