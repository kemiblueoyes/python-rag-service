components:
  schemas:
    AnswerRequest:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
          description: Natural-language question to answer. The service trims leading
            and trailing whitespace, then accepts 1 to 2000 characters.
          examples:
          - Why does inconsistent terminology cause retrieval failures?
        filters:
          anyOf:
          - $ref: '#/components/schemas/SearchFilters'
          - type: 'null'
          description: Optional metadata filters applied during retrieval. The service
            trims each value, then accepts 1 to 256 characters. A list accepts 1 to
            50 values.
      additionalProperties: false
      type: object
      required:
      - query
      title: AnswerRequest
      description: Request body for POST /v1/answer.
    AnswerResponse:
      properties:
        query:
          type: string
          title: Query
          description: The question submitted by the client.
        answer:
          type: string
          title: Answer
          description: Grounded answer generated from retrieved evidence.
        sources:
          items:
            $ref: '#/components/schemas/AnswerSource'
          type: array
          title: Sources
          description: Validated sources cited by the generated answer.
        sufficient_evidence:
          type: boolean
          title: Sufficient Evidence
          description: Whether the retrieved sources contained enough evidence to
            answer the question.
      type: object
      required:
      - query
      - answer
      - sources
      - sufficient_evidence
      title: AnswerResponse
      description: Successful response from POST /v1/answer.
    AnswerSource:
      properties:
        citation_id:
          type: string
          title: Citation Id
          description: Request-local citation identifier used in the generated answer.
          examples:
          - S1
        chunk_id:
          type: string
          title: Chunk Id
          description: Stable identifier for the supporting chunk.
        document_id:
          type: string
          title: Document Id
          description: Stable identifier for the source document.
        title:
          type: string
          title: Title
          description: Title of the source document.
        heading_path:
          items:
            type: string
          type: array
          title: Heading Path
          description: Heading hierarchy containing the supporting chunk.
        anchor:
          anyOf:
          - type: string
          - type: 'null'
          title: Anchor
          description: Source anchor for the supporting chunk's current heading.
        excerpt:
          type: string
          title: Excerpt
          description: Text from the supporting chunk.
        url:
          type: string
          title: Url
          description: Trusted URL for the source document.
      type: object
      required:
      - citation_id
      - chunk_id
      - document_id
      - title
      - heading_path
      - excerpt
      - url
      title: AnswerSource
      description: One validated source supporting a generated answer.
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable error code.
          examples:
          - validation_error
        message:
          type: string
          title: Message
          description: Human-readable summary of the error.
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: Additional error details.
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorDetail:
      properties:
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
          description: Request field associated with the error.
          examples:
          - filters.site_id
        message:
          type: string
          title: Message
          description: Human-readable description of the error.
      type: object
      required:
      - message
      title: ErrorDetail
      description: Details about one request error.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
      description: Standard error response returned by the public API.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Current service health status.
          examples:
          - ok
      type: object
      required:
      - status
      title: HealthResponse
      description: Successful response from GET /health.
    SearchFilters:
      properties:
        document_id:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - items:
              type: string
              maxLength: 256
              minLength: 1
            type: array
            maxItems: 50
            minItems: 1
          - type: 'null'
          title: Document Id
          description: 'Limit results to chunks from specific documents using the
            document IDs created by the RAG service, such as ''wordpress:page:123''.
            Copy the document_id from a search result to use it as a filter. Provide
            one ID as a string or multiple IDs as a list of strings, such as [''wordpress:page:123'',
            ''wordpress:page:124''].


            If omitted, results are not restricted by document ID.'
        source:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - items:
              type: string
              maxLength: 256
              minLength: 1
            type: array
            maxItems: 50
            minItems: 1
          - type: 'null'
          title: Source
          description: 'Limit results to one or more content sources. If omitted,
            searches content from all sources in the index.


            Currently, only ''wordpress'' is supported, so omitting this filter still
            searches only WordPress content.'
        source_id:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - items:
              type: string
              maxLength: 256
              minLength: 1
            type: array
            maxItems: 50
            minItems: 1
          - type: 'null'
          title: Source Id
          description: 'Limit results to chunks from specific documents using their
            original IDs in the source system. For WordPress, use the post or page
            ID as a string, such as ''123''. Provide one ID as a string or multiple
            IDs as a list of strings, such as [''123'', ''124''].


            If omitted, results are not restricted by source-system document ID.'
        content_type:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - items:
              type: string
              maxLength: 256
              minLength: 1
            type: array
            maxItems: 50
            minItems: 1
          - type: 'null'
          title: Content Type
          description: 'Limit results by the type of document the content came from,
            such as ''post'' or ''page'' for WordPress content. Provide one type as
            a string or multiple types as a list of strings, such as [''post'', ''page''].


            If omitted, searches all content types in the index.'
      additionalProperties: false
      type: object
      title: SearchFilters
      description: Supported metadata filters for hybrid search.
    SearchRequest:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
          description: Natural-language search query. The service trims leading and
            trailing whitespace, then accepts 1 to 2000 characters.
          examples:
          - How does metadata improve retrieval?
        filters:
          anyOf:
          - $ref: '#/components/schemas/SearchFilters'
          - type: 'null'
          description: Optional metadata filters applied during retrieval. The service
            trims each value, then accepts 1 to 256 characters. A list accepts 1 to
            50 values.
        limit:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Limit
          description: Maximum number of search results to retrieve. Use an integer
            from 1 to 20. The default is 5.
          default: 5
          examples:
          - 5
      additionalProperties: false
      type: object
      required:
      - query
      title: SearchRequest
      description: Request body for POST /v1/search.
    SearchResponse:
      properties:
        query:
          type: string
          title: Query
          description: The search query submitted by the client.
        results:
          items:
            $ref: '#/components/schemas/SearchResult'
          type: array
          title: Results
          description: Ranked search results that met the retrieval threshold.
      type: object
      required:
      - query
      - results
      title: SearchResponse
      description: Successful response from POST /v1/search.
    SearchResult:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
          description: Stable identifier for the retrieved chunk.
        document_id:
          type: string
          title: Document Id
          description: Stable identifier for the source document.
        title:
          type: string
          title: Title
          description: Title of the source document.
        heading_path:
          items:
            type: string
          type: array
          title: Heading Path
          description: Heading hierarchy containing the retrieved chunk.
        anchor:
          anyOf:
          - type: string
          - type: 'null'
          title: Anchor
          description: Source anchor for the retrieved chunk's current heading.
        excerpt:
          type: string
          title: Excerpt
          description: Text from the retrieved chunk.
        url:
          type: string
          title: Url
          description: Trusted URL for the source document.
        score:
          type: number
          title: Score
          description: Rerank score for the result.
      type: object
      required:
      - chunk_id
      - document_id
      - title
      - heading_path
      - excerpt
      - url
      - score
      title: SearchResult
      description: One ranked search result.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
