# CI: continuous integration checks for this repo.
#
# What this workflow does:
# - Starts on every push and pull request
# - Creates a clean Ubuntu environment
# - Installs Python and your dependencies
# - Checks code with Ruff
# - Runs your tests
# - Validates documentation
# - Audits locked Python and npm dependencies
# - Publishes documentation on main after the test and audit jobs, then checks live links

name: CI

# Trigger: run on every push and every pull request
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Do not interrupt a production deployment already in progress.
  cancel-in-progress: false

jobs:
  test:
    # Fresh Ubuntu VM for each run (clean environment)
    runs-on: ubuntu-latest

    steps:
      # Clone this repository into the runner workspace
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install the uv package manager (used for Python + deps)
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Install the Python version used by CI
      - name: Set up Python
        run: uv python install 3.12

      # Install project + dev dependencies from pyproject.toml / uv.lock
      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Install Fern so documentation validation can run
      - name: Install Fern CLI
        run: |
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          npm install -g "fern-api@${FERN_VERSION}"

      # Install markdownlint and jsdom from package-lock.json
      - name: Install documentation lint dependencies
        run: npm ci

      - name: Run WordPress browser link tests
        run: node --test clients/wordpress/python-rag-service-client/tests/rag-search.test.js

      - name: Run documentation lint tests
        run: node --test scripts/lint-docs.test.mjs

      # Lint / static checks with Ruff
      - name: Run Ruff
        run: uv run ruff check .

      # Run the pytest suite
      - name: Run tests
        run: uv run pytest

      # Vale is not in Ubuntu 24.04 apt. Pin the same GitHub release
      # as local Homebrew (3.22.0). 3.17.1 cannot lint MDX without
      # the separate mdx2vast helper.
      - name: Install Vale
        env:
          VALE_VERSION: "3.22.0"
        run: |
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      # Validate generated OpenAPI and Fern configuration
      - name: Validate documentation
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            uv run python -m rag_service.commands.documentation.validate_docs --production
          else
            uv run python -m rag_service.commands.documentation.validate_docs
          fi

  wordpress-rate-limit:
    name: WordPress MySQL rate limit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rag_test_password
          MYSQL_DATABASE: rag_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prag_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RAG_TEST_MYSQL_HOST: 127.0.0.1
      RAG_TEST_MYSQL_PORT: "3306"
      RAG_TEST_MYSQL_USER: root
      RAG_TEST_MYSQL_PASSWORD: rag_test_password
      RAG_TEST_MYSQL_DATABASE: rag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, pdo_sqlite, mbstring
          coverage: none

      - name: Check PHP syntax
        run: find clients/wordpress/python-rag-service-client -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run WordPress stub and SQLite tests
        run: php clients/wordpress/python-rag-service-client/tests/run-tests.php

      - name: Run production MySQL rate-limit tests
        run: php clients/wordpress/python-rag-service-client/tests/run-mysql-tests.php

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit locked dependencies
        run: bash scripts/audit-locked-dependencies.sh

  publish-docs:
    name: Publish Fern documentation
    needs: [test, wordpress-rate-limit, dependency-audit]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check whether the validated commit is still current
        id: current-commit
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping publication because main has a newer commit.'
          fi

      - name: Set up Node.js
        if: steps.current-commit.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Fern CLI
        if: steps.current-commit.outputs.current == 'true'
        run: |
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          npm install -g "fern-api@${FERN_VERSION}"

      - name: Publish production documentation
        id: publish
        if: steps.current-commit.outputs.current == 'true'
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -z "$FERN_TOKEN" ]; then
            echo '::error::Add the FERN_TOKEN repository secret before publishing.'
            exit 1
          fi
          fern generate --docs --instance https://python-rag-service.docs.buildwithfern.com

  check-published-links:
    name: Check published documentation links
    needs: publish-docs
    if: needs.publish-docs.outputs.published == 'true'
    uses: ./.github/workflows/docs-link-check.yml
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
