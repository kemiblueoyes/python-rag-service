extends: conditional
message: "Define '%s' on first use."
level: warning
scope: text
ignorecase: false
vocab: false

first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Za-z][A-Za-z-]* )+\(([A-Z]{3,5})\)'

exceptions:
  - API
  - URL
  - HTTP
  - HTTPS
  - JSON
  - HTML
  - YAML
  - SDK
  - CLI
  - RAG
  - POST
  - GET
  - PUT
  - DELETE
  - REST
  - MIT