extends: existence
message: "The application validates citations; do not attribute citation validation to the model."
level: error
ignorecase: true

tokens:
  - '\b(?:the\s+)?(?:model|language model|LLM|AI)\s+(?:validates?|verifies?)\s+(?:its\s+)?citations?\b'
  - '\b(?:the\s+)?(?:model|language model|LLM|AI)\s+(?:validates?|verifies?)\s+(?:its\s+)?sources?\b'